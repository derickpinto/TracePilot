version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ai-dashboard-api:local
    container_name: ai-dashboard-api
    restart: unless-stopped
    env_file: .env
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
    networks:
      - ai-dashboard
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
    image: ai-dashboard-web:local
    container_name: ai-dashboard-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ai-dashboard
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  ai-dashboard:
    driver: bridge
