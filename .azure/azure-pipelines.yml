trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    exclude:
      - '**/*.md'

pr:
  branches:
    include:
      - main

variables:
  - group: ai-dashboard-secrets          # Azure DevOps variable group
    # Expected variables in the group:
    # ACR_NAME           — e.g. myacr
    # ACR_LOGIN_SERVER   — e.g. myacr.azurecr.io
    # AKS_RESOURCE_GROUP
    # AKS_CLUSTER_NAME
    # HELM_RELEASE_NAME  — e.g. ai-dashboard
    # HELM_NAMESPACE     — e.g. ai-dashboard
  - name: NODE_VERSION
    value: '20.x'
  - name: PNPM_VERSION
    value: '9'

pool:
  vmImage: ubuntu-latest

stages:
  # ────────────────────────────────────────────────────────────────
  # Stage 1: Lint + Type-check
  # ────────────────────────────────────────────────────────────────
  - stage: QualityGate
    displayName: 'Quality Gate'
    jobs:
      - job: LintAndTypeCheck
        displayName: 'Lint & Type-check'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Setup Node.js'

          - script: npm install -g pnpm@$(PNPM_VERSION)
            displayName: 'Install pnpm'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: pnpm turbo lint type-check
            displayName: 'Run lint + type-check'

  # ────────────────────────────────────────────────────────────────
  # Stage 2: Test
  # ────────────────────────────────────────────────────────────────
  - stage: Test
    displayName: 'Unit Tests'
    dependsOn: QualityGate
    jobs:
      - job: UnitTests
        displayName: 'Run Tests'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm install -g pnpm@$(PNPM_VERSION)
            displayName: 'Install pnpm'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: pnpm turbo test -- --ci
            displayName: 'Run unit tests'

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testRunner: JUnit
              testResultsFiles: '**/coverage/junit.xml'

          - task: PublishCodeCoverageResults@1
            condition: always()
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: '**/coverage/cobertura-coverage.xml'

  # ────────────────────────────────────────────────────────────────
  # Stage 3: Build Docker Images + Push to ACR
  # ────────────────────────────────────────────────────────────────
  - stage: DockerBuild
    displayName: 'Docker Build & Push'
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      IMAGE_TAG: $(Build.BuildId)
    jobs:
      - job: BuildAndPush
        displayName: 'Build & Push Images'
        steps:
          - task: AzureCLI@2
            displayName: 'ACR Login'
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: az acr login --name $(ACR_NAME)

          - task: Docker@2
            displayName: 'Build API image'
            inputs:
              command: build
              dockerfile: apps/api/Dockerfile
              buildContext: .
              repository: $(ACR_LOGIN_SERVER)/ai-dashboard-api
              tags: |
                $(IMAGE_TAG)
                latest

          - task: Docker@2
            displayName: 'Push API image'
            inputs:
              command: push
              repository: $(ACR_LOGIN_SERVER)/ai-dashboard-api
              tags: |
                $(IMAGE_TAG)
                latest

          - task: Docker@2
            displayName: 'Build Web image'
            inputs:
              command: build
              dockerfile: apps/web/Dockerfile
              buildContext: .
              repository: $(ACR_LOGIN_SERVER)/ai-dashboard-web
              tags: |
                $(IMAGE_TAG)
                latest
              arguments: >
                --build-arg NEXT_PUBLIC_API_URL=$(NEXT_PUBLIC_API_URL)
                --build-arg NEXT_PUBLIC_WS_URL=$(NEXT_PUBLIC_WS_URL)

          - task: Docker@2
            displayName: 'Push Web image'
            inputs:
              command: push
              repository: $(ACR_LOGIN_SERVER)/ai-dashboard-web
              tags: |
                $(IMAGE_TAG)
                latest

          # Save image tag for deployment stage
          - bash: echo "##vso[task.setvariable variable=IMAGE_TAG;isOutput=true]$(IMAGE_TAG)"
            name: setImageTag

  # ────────────────────────────────────────────────────────────────
  # Stage 4: Helm Deploy to AKS
  # ────────────────────────────────────────────────────────────────
  - stage: Deploy
    displayName: 'Deploy to AKS'
    dependsOn: DockerBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      IMAGE_TAG: $[ stageDependencies.DockerBuild.BuildAndPush.outputs['setImageTag.IMAGE_TAG'] ]
    jobs:
      - deployment: HelmDeploy
        displayName: 'Helm Upgrade'
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Get AKS credentials'
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(AKS_RESOURCE_GROUP) \
                        --name $(AKS_CLUSTER_NAME) \
                        --overwrite-existing

                - task: HelmDeploy@0
                  displayName: 'Helm upgrade --install'
                  inputs:
                    command: upgrade
                    chartType: FilePath
                    chartPath: helm/ai-dashboard
                    releaseName: $(HELM_RELEASE_NAME)
                    namespace: $(HELM_NAMESPACE)
                    install: true
                    waitForExecution: true
                    arguments: >
                      --set global.imageRegistry=$(ACR_LOGIN_SERVER)
                      --set api.image.tag=$(IMAGE_TAG)
                      --set web.image.tag=$(IMAGE_TAG)
                      --create-namespace
                      --timeout 5m0s
