# ─────────────────────────────────────────────────────────────────
# Kafka + MongoDB + Kafka UI — local dev infrastructure
#
# Usage:
#   docker compose up -d
#   docker compose down -v   (also removes mongo volume)
#
# Listener architecture (3 listeners on the broker):
#   INTERNAL  port 29092  — container-to-container inside this network
#                           (kafka-ui connects here; advertised as kafka:29092)
#   EXTERNAL  port 9092   — host processes (producer script, API on host)
#                           (advertised as localhost:9092)
#   DOCKER    port 9093   — other Docker networks, e.g. docker-compose.dev.yml
#                           (advertised as host.docker.internal:9093)
#
# Other ports:
#   27017 — MongoDB
#   8080  — Kafka UI  →  http://localhost:8080
# ─────────────────────────────────────────────────────────────────

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kafka-setup-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-setup-broker
    hostname: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"   # host processes (producer script, API running on host)
      - "9093:9093"   # Docker containers in other compose networks
      # 29092 is intentionally NOT published — internal only
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Three listeners:
      #   INTERNAL  — for kafka-ui and other services in THIS compose network
      #   EXTERNAL  — for host machine processes
      #   DOCKER    — for containers in other compose networks (docker-compose.dev.yml)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092,DOCKER://host.docker.internal:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-setup-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Connect via INTERNAL listener — stays within Docker network,
      # so metadata responses resolve correctly to kafka:29092
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_READONLY: 'false'
      DYNAMIC_CONFIG_ENABLED: 'true'

  mongodb:
    image: mongo:7
    container_name: kafka-setup-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
