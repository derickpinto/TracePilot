# ─── Global ────────────────────────────────────────────────────────────────────
global:
  imageRegistry: ""  # e.g. myacr.azurecr.io
  imagePullSecrets: []
  # - name: acr-secret

# ─── API Service ───────────────────────────────────────────────────────────────
api:
  enabled: true
  image:
    repository: ai-dashboard-api
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 4000

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  env:
    PORT: "4000"
    NODE_ENV: "production"
    CORS_ORIGINS: "http://localhost:3000"
    KAFKA_BROKERS: "kafka:9092"
    KAFKA_TOPICS: "ai-workflow-events"
    KAFKA_GROUP_ID: "ai-dashboard-group"
    KAFKA_CLIENT_ID: "ai-dashboard"
    KAFKA_SSL: "false"
    STATE_MAX_WORKFLOWS: "10000"
    STATE_TTL_MINUTES: "60"

  # Secret env vars — mount from K8s Secret
  secretEnv:
    enabled: false
    secretName: ""  # Name of existing K8s Secret
    # Keys to pull from the secret:
    # KAFKA_SASL_USERNAME, KAFKA_SASL_PASSWORD, MONGO_URI

  podAnnotations: {}
  podLabels: {}

  livenessProbe:
    httpGet:
      path: /api/health
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /api/health
      port: 4000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# ─── Web Frontend ──────────────────────────────────────────────────────────────
web:
  enabled: true
  image:
    repository: ai-dashboard-web
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  env:
    NODE_ENV: "production"
    NEXT_TELEMETRY_DISABLED: "1"

  buildArgs:
    apiUrl: "http://ai-dashboard-api:4000/api"
    wsUrl: "http://ai-dashboard-api:4000"

  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 15

  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10

# ─── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    # WebSocket upgrade for Socket.io
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
  hosts:
    - host: ai-dashboard.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /socket.io
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: web
  tls: []
  # - secretName: ai-dashboard-tls
  #   hosts:
  #     - ai-dashboard.example.com

# ─── Namespace ─────────────────────────────────────────────────────────────────
namespace: ai-dashboard
