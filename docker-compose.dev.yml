# ─────────────────────────────────────────────────────────────────
# DEV COMPOSE — hot-reload, source mounted as volumes
# Changes to source files reflect immediately inside containers.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml down
# ─────────────────────────────────────────────────────────────────

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: ai-dashboard-kafka
    restart: unless-stopped
    ports:
      # 9094 exposed to host so the simulator script (running on host) can publish
      - '9094:9094'
    environment:
      KAFKA_CFG_NODE_ID: '1'
      KAFKA_CFG_PROCESS_ROLES: 'broker,controller'
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      # Three listeners: internal (Docker services), controller (KRaft), external (host)
      KAFKA_CFG_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094'
      KAFKA_CFG_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
    networks:
      - ai-dashboard-dev
    healthcheck:
      test: ['CMD', 'kafka-topics.sh', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api-dev:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    image: ai-dashboard-api:dev
    container_name: ai-dashboard-api-dev
    restart: unless-stopped
    env_file: .env
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      # Override to talk to web inside docker network
      CORS_ORIGINS: 'http://localhost:3000'
      # Connect to the Kafka container on the Docker-internal listener
      KAFKA_BROKERS: 'kafka:9092'
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      # Source — hot-reload watches these
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      # node_modules come from the image — do NOT mount host node_modules
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
    networks:
      - ai-dashboard-dev
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  web-dev:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    image: ai-dashboard-web:dev
    container_name: ai-dashboard-web-dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: 'http://localhost:4000/api'
      NEXT_PUBLIC_WS_URL: 'http://localhost:4000'
      # Required for Next.js hot-reload to reach host browser via Docker
      WATCHPACK_POLLING: 'true'
    volumes:
      # Source directories — Next.js watches these
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/components:/app/apps/web/components
      - ./apps/web/hooks:/app/apps/web/hooks
      - ./apps/web/lib:/app/apps/web/lib
      - ./apps/web/store:/app/apps/web/store
      - ./apps/web/styles:/app/apps/web/styles
      - ./apps/web/public:/app/apps/web/public
      - ./packages/shared/src:/app/packages/shared/src
      # Exclude node_modules and .next cache from host
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/shared/node_modules
    depends_on:
      api-dev:
        condition: service_healthy
    networks:
      - ai-dashboard-dev

networks:
  ai-dashboard-dev:
    driver: bridge
