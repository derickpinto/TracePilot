# ─────────────────────────────────────────────────────────────────
# DEV COMPOSE — hot-reload, source mounted as volumes
# Changes to source files reflect immediately inside containers.
#
# Requires kafka-setup to be running first:
#   cd kafka-setup && docker compose up -d
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml down
# ─────────────────────────────────────────────────────────────────

services:
  api-dev:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    image: ai-dashboard-api:dev
    container_name: ai-dashboard-api-dev
    restart: unless-stopped
    env_file: .env
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      CORS_ORIGINS: 'http://localhost:3000'
      # Reach the kafka-setup services running on the host machine
      # Port 9093 = DOCKER listener (advertised as host.docker.internal:9093)
      KAFKA_BROKERS: 'host.docker.internal:9093'
      MONGO_URI: 'mongodb://host.docker.internal:27017'
    volumes:
      # Source — hot-reload watches these
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      # node_modules come from the image — do NOT mount host node_modules
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
    networks:
      - ai-dashboard-dev
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  web-dev:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    image: ai-dashboard-web:dev
    container_name: ai-dashboard-web-dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: 'http://localhost:4000/api'
      NEXT_PUBLIC_WS_URL: 'http://localhost:4000'
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/components:/app/apps/web/components
      - ./apps/web/hooks:/app/apps/web/hooks
      - ./apps/web/lib:/app/apps/web/lib
      - ./apps/web/store:/app/apps/web/store
      - ./apps/web/styles:/app/apps/web/styles
      - ./apps/web/public:/app/apps/web/public
      - ./packages/shared/src:/app/packages/shared/src
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/shared/node_modules
    depends_on:
      api-dev:
        condition: service_healthy
    networks:
      - ai-dashboard-dev

networks:
  ai-dashboard-dev:
    driver: bridge
